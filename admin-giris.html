<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sur Halı İznik - Yönetici Girişi</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f1eb;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-box {
            background: #ffffff;
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 28px;
            color: #4a3728;
            margin-bottom: 8px;
        }

        .logo p {
            color: #777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #4a3728;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #8b6f47;
            box-shadow: 0 0 0 3px rgba(139, 111, 71, 0.10);
        }

        .login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #4a3728;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-button:hover {
            background: #6b4f35;
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            word-break: break-word;
        }

        .message.error {
            display: block;
            background: #fce8e8;
            color: #a33a3a;
        }

        .message.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #777;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: #4a3728;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <div class="logo">
            <h1>Sur Halı İznik</h1>
            <p>Yönetici Paneli Girişi</p>
        </div>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">E-posta</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Yönetici e-posta adresiniz"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Şifre</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Şifreniz"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                Giriş Yap
            </button>

            <div id="message" class="message"></div>

        </form>

        <a href="index.html" class="back-link">
            ← Ana siteye dön
        </a>

    </div>

</div>


<!-- =====================================================
     SUPABASE KÜTÜPHANESİ
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

    /*
    =====================================================
    SUPABASE PROJE BİLGİLERİ
    =====================================================

    AKTİF PROJE:
    sur-hali

    PROJECT ID:
    nnvbxtjpfpfwegewtnkc

    ÖNEMLİ:
    URL VE API KEY AYNI SUPABASE PROJESİNE AİT OLMALIDIR.
    =====================================================
    */


    const SUPABASE_URL =
        "https://nnvbxtjpfpfwegewtnkc.supabase.co";


    /*
    =====================================================
    SUPABASE PUBLISHABLE KEY
    =====================================================

    Bu anahtar:
    Supabase
    Settings
    API Keys
    Publishable key

    bölümündeki anahtardır.
    =====================================================
    */

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_E9VrVoS_YRzurbWrAF5-3A_aMJX1pBh";


    /*
    =====================================================
    SUPABASE CLIENT OLUŞTUR
    =====================================================
    */

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    /*
    =====================================================
    FORM ELEMANLARI
    =====================================================
    */

    const loginForm =
        document.getElementById("loginForm");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const loginButton =
        document.getElementById("loginButton");

    const message =
        document.getElementById("message");


    /*
    =====================================================
    GİRİŞ İŞLEMİ
    =====================================================
    */

    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            /*
            Kullanıcı bilgilerini al
            */

            const email =
                emailInput.value.trim();

            const password =
                passwordInput.value;


            /*
            Önceki mesajı temizle
            */

            message.className =
                "message";

            message.textContent =
                "";


            /*
            Butonu geçici olarak kilitle
            */

            loginButton.disabled =
                true;

            loginButton.textContent =
                "Giriş yapılıyor...";


            try {

                /*
                =================================================
                SUPABASE AUTH İLE GİRİŞ
                =================================================
                */

                const {
                    data,
                    error
                } =
                await supabaseClient.auth.signInWithPassword({

                    email: email,

                    password: password

                });


                /*
                =================================================
                SUPABASE HATASI
                =================================================
                */

                if (error) {

                    console.error(
                        "Supabase giriş hatası:",
                        error
                    );

                    message.className =
                        "message error";

                    message.textContent =
                        "Giriş hatası: " +
                        error.message;

                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "Giriş Yap";

                    return;
                }


                /*
                =================================================
                BAŞARILI GİRİŞ
                =================================================
                */

                if (
                    data &&
                    data.session
                ) {

                    message.className =
                        "message success";

                    message.textContent =
                        "Giriş başarılı! Yönetim paneli açılıyor...";


                    /*
                    =================================================
                    ADMIN PANELİNE YÖNLENDİR
                    =================================================
                    */

                    setTimeout(
                        function() {

                            window.location.href =
                                "admin-panel.html";

                        },
                        1000
                    );

                } else {

                    /*
                    Oturum oluşmadıysa
                    */

                    message.className =
                        "message error";

                    message.textContent =
                        "Giriş yapılamadı. Oturum oluşturulamadı.";

                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "Giriş Yap";

                }

            } catch (error) {

                /*
                =================================================
                BEKLENMEYEN SİSTEM HATASI
                =================================================
                */

                console.error(
                    "Beklenmeyen hata:",
                    error
                );

                message.className =
                    "message error";

                message.textContent =
                    "Sistem hatası: " +
                    error.message;

                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "Giriş Yap";

            }

        }
    );

</script>

</body>
</html>
