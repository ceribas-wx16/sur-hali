<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sur Halı | Yönetim Paneli</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin-panel.css">

</head>


<body>


<div class="admin-layout">


    <!-- SIDEBAR -->

    <aside class="sidebar">


        <div class="logo">

            <h2>Sur Halı</h2>

            <span>
                Yönetim Paneli
            </span>

        </div>



        <nav class="menu">


            <button 
            class="menu-item active" 
            data-page="dashboard">

                📊 Dashboard

            </button>



            <button 
            class="menu-item" 
            data-page="urunler">

                🛋️ Ürün Yönetimi

            </button>



            <button 
            class="menu-item" 
            data-page="resimler">

                🖼️ Resim Yükleme

            </button>



            <button 
            class="menu-item" 
            data-page="ayarlar">

                ⚙️ Site Ayarları

            </button>



            <button 
            id="logoutButton" 
            class="menu-item logout">

                🚪 Çıkış

            </button>


        </nav>


    </aside>





    <!-- ANA İÇERİK -->


    <main class="content">



        <!-- DASHBOARD -->


        <section 
        id="dashboard" 
        class="page active-page">


            <h1>
                Dashboard
            </h1>



            <div class="cards">



                <div class="card">

                    <h3>
                        Toplam Ürün
                    </h3>

                    <p id="totalProducts">
                        0
                    </p>

                </div>




                <div class="card">

                    <h3>
                        Toplam Resim
                    </h3>

                    <p id="totalImages">
                        0
                    </p>

                </div>





                <div class="card">

                    <h3>
                        Storage Kullanımı
                    </h3>

                    <p id="storageUsage">
                        -
                    </p>

                </div>



            </div>


        </section>






        <!-- ÜRÜN YÖNETİMİ -->


        <section 
        id="urunler" 
        class="page">



            <div class="section-header">


                <h1>
                    Ürün Yönetimi
                </h1>



                <button 
                id="newProductButton">

                    + Yeni Ürün

                </button>


            </div>





            <table class="admin-table">


                <thead>


                    <tr>

                        <th>
                            Ürün
                        </th>


                        <th>
                            Kategori
                        </th>


                        <th>
                            Durum
                        </th>


                        <th>
                            İşlem
                        </th>


                    </tr>


                </thead>



                <tbody id="productTableBody">


                </tbody>



            </table>



        </section>







        <!-- RESİM YÜKLEME -->


        <section 
        id="resimler" 
        class="page">



            <h1>
                Resim Yükleme
            </h1>




            <div class="upload-box">



                <input

                type="file"

                id="imageInput"

                accept="image/*"

                >





                <button 
                id="uploadImageButton">


                    Resmi Yükle


                </button>



            </div>





            <div

            id="imageGallery"

            class="image-gallery">


            </div>



        </section>







        <!-- AYARLAR -->


        <section 
        id="ayarlar" 
        class="page">



            <h1>
                Site Ayarları
            </h1>





            <form 
            id="settingsForm">





                <div class="form-group">


                    <label>
                        Site Başlığı
                    </label>


                    <input

                    type="text"

                    id="siteTitle"

                    placeholder="Sur Halı İznik"

                    >


                </div>






                <div class="form-group">


                    <label>
                        Telefon
                    </label>


                    <input

                    type="text"

                    id="sitePhone"

                    >


                </div>






                <div class="form-group">


                    <label>
                        Adres
                    </label>



                    <textarea

                    id="siteAddress"

                    rows="4">

                    </textarea>


                </div>






                <button 
                type="submit">


                    Kaydet


                </button>




            </form>




        </section>
<!-- ========================= -->
<!-- YENİ ÜRÜN MODALI -->
<!-- ========================= -->

<div id="productModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>Yeni Ürün Ekle</h2>

            <span id="closeModal" class="close">&times;</span>

        </div>

        <div class="modal-body">

            <div class="form-group">

                <label>Ürün Adı</label>

                <input
                    type="text"
                    id="productName"
                    placeholder="Örn: Klasik Halı 160x230">

            </div>

            <div class="form-group">

                <label>Kategori</label>

                <input
                    type="text"
                    id="productCategory"
                    placeholder="Örn: Klasik Halılar">

            </div>

            <div class="form-group">

                <label>Ölçü</label>

                <input
                    type="text"
                    id="productSize"
                    placeholder="Örn: 160x230">

            </div>

            <div class="form-group">

                <label>Fiyat (TL)</label>

                <input
                    type="number"
                    id="productPrice"
                    placeholder="0">

            </div>

            <div class="form-group">

                <label>Açıklama</label>

                <textarea
                    id="productDescription"
                    rows="4"
                    placeholder="Ürün açıklaması">
                </textarea>

            </div>

            <div class="form-group">

                <label>Ürün Resmi</label>

                <input
                    type="file"
                    id="productImage"
                    accept="image/*">

            </div>

        </div>

        <div class="modal-footer">

            <button id="saveProductButton">

                💾 Ürünü Kaydet

            </button>

        </div>

    </div>

</div>



    </main>



</div>






<!-- SCRIPTS -->


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="supabase.js"></script>


<script src="admin-panel.js"></script>



</body>

</html>
