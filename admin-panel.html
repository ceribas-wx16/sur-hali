<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sur Halı İznik - Admin Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="admin-container">
        <!-- SOL MENÜ -->
        <aside class="sidebar">
            <div class="logo-area">
                <!-- Logonuzun adını/yolunu kontrol edin -->
                <img src="logo.png" alt="Sur Halı Logo" onerror="this.src='https://via.placeholder.com/110'">
                <h2>SUR HALI</h2>
                <p>YÖNETİM PANELİ</p>
            </div>
            <nav class="menu">
                <button class="menu-item active" data-page="dashboard">📊 Dashboard</button>
                <button class="menu-item" data-page="urun-yonetimi">📦 Ürün Yönetimi</button>
                <button class="menu-item" data-page="resim-yukleme">🖼️ Resim Yükleme</button>
                <button class="menu-item" data-page="site-ayarlari">⚙️ Site Ayarları</button>
                <button class="menu-item logout" id="logoutButton">🚪 Çıkış Yap</button>
            </nav>
        </aside>

        <!-- SAĞ İÇERİK ALANI -->
        <main class="content">

            <!-- 1. DASHBOARD -->
            <section id="dashboard" class="page active-page">
                <h1>Dashboard</h1>
                <p>Sur Halı Yönetim Paneline hoş geldiniz.</p>
                <br>
                <div class="cards-grid">
                    <div class="card">
                        <h3>📦 Toplam Ürün</h3>
                        <p id="totalProducts" class="card-value">0</p>
                    </div>
                    <div class="card">
                        <h3>🖼️ Toplam Resim</h3>
                        <p id="totalImages" class="card-value">0</p>
                    </div>
                    <div class="card">
                        <h3>☁️ Storage Usage</h3>
                        <p id="storageUsage" class="card-value">-</p>
                    </div>
                </div>
            </section>

            <!-- 2. ÜRÜN YÖNETİMİ -->
            <section id="urun-yonetimi" class="page">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h1>Ürün Yönetimi</h1>
                    <button id="newProductButton" class="btn btn-primary">+ Yeni Ürün Ekle</button>
                </div>
                
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Ürün Adı / Ebat</th>
                            <th>Kategori</th>
                            <th>Durum</th>
                            <th>İşlemler</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody">
                        <!-- Ürünler JS ile buraya yüklenecek -->
                    </tbody>
                </table>
            </section>

            <!-- 3. RESİM YÜKLEME -->
            <section id="resim-yukleme" class="page">
                <h1>Resim Yükleme & Galeri</h1>
                <div id="imageGallery" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:15px; margin-top:20px;">
                    <!-- Resimler JS ile yüklenecek -->
                </div>
            </section>

            <!-- 4. SİTE AYARLARI -->
            <section id="site-ayarlari" class="page">
                <h1>Site Ayarları</h1>
                <form id="settingsForm" style="max-width:400px; margin-top:20px;">
                    <label>Site Başlığı:</label>
                    <input type="text" id="siteTitle" style="width:100%; padding:8px; margin:5px 0 15px 0;">
                    
                    <label>Telefon:</label>
                    <input type="text" id="sitePhone" style="width:100%; padding:8px; margin:5px 0 15px 0;">
                    
                    <label>Adres:</label>
                    <textarea id="siteAddress" rows="3" style="width:100%; padding:8px; margin:5px 0 15px 0;"></textarea>
                    
                    <button type="submit" class="btn btn-success">Kaydet</button>
                </form>
            </section>

        </main>
    </div>

    <!-- ÜRÜN EKLE/DÜZENLE MODAL -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <h2>Ürün Kaydet</h2>
            <form id="productForm" onsubmit="event.preventDefault();">
                <input type="text" id="productName" placeholder="Ürün Adı" required>
                <input type="text" id="productCategory" placeholder="Kategori (Örn: Halı)" required>
                <input type="text" id="productSize" placeholder="Ebat (Örn: 160x230)">
                <input type="number" id="productPrice" placeholder="Fiyat (TL)">
                <textarea id="productDescription" placeholder="Açıklama"></textarea>
                <label style="font-size:12px; color:#666;">Ürün Görseli Seçin:</label>
                <input type="file" id="productImage" accept="image/*">
                
                <div style="margin-top:15px; display:flex; gap:10px; justify-content:flex-end;">
                    <button type="button" id="saveProductButton" class="btn btn-success">Kaydet</button>
                    <button type="button" id="closeModal" class="btn btn-secondary">İptal</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPT'LERİN YÜKLENME SIRASI (ÇOK ÖNEMLİ!) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="admin.js"></script>
</body>
</html>
