<body>

<header>

<img src="logo.png" alt="Sur Halı İznik">

<h1>HALI KOLEKSİYONU</h1>

<p>Sur Halı İznik • Premium Halılar</p>

</header>

<div class="container">

<div
id="gallery"
class="gallery">

<div class="loading">

Ürünler yükleniyor...

</div>

</div>

<div class="back">

<a href="index.html">

← Ana Sayfaya Dön

</a>

</div>

</div>

<footer>

© 2026 Sur Halı İznik • Tüm Hakları Saklıdır.

</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script>

const gallery = document.getElementById("gallery");

  async function loadProducts(){

    gallery.innerHTML = `
        <div class="loading">
            Ürünler yükleniyor...
        </div>
    `;

    try{

        const { data, error } = await supabase
            .from("products")
            .select("*")
            .eq("is_active", true)
            .eq("category", "Halılar")
            .order("created_at", { ascending:false });

        if(error){

            console.error(error);

            gallery.innerHTML = `
                <div class="error">
                    Ürünler yüklenemedi.
                </div>
            `;

            return;

        }

        if(!data || data.length===0){

            gallery.innerHTML = `
                <div class="empty">
                    Bu kategoride henüz ürün bulunmuyor.
                </div>
            `;

            return;

        }

        gallery.innerHTML="";

        data.forEach(product=>{

            gallery.innerHTML += `

            <div class="card">

                <img
                    src="${product.image_url}"
                    alt="${product.name}"
                    loading="lazy">

                <div class="card-content">

                    <h2>${product.name}</h2>

                    <div class="price">

                        ${Number(product.price).toLocaleString("tr-TR")} ₺

                    </div>

                    <div class="size">

                        ${product.size || "-"}

                    </div>

                    <div class="description">

                        ${product.description || ""}

                    </div>

                </div>

            </div>

            `;

        });

    }

    catch(err){

        console.error(err);

        gallery.innerHTML = `
            <div class="error">
                Beklenmeyen bir hata oluştu.
            </div>
        `;

    }

}

loadProducts();

</script>
