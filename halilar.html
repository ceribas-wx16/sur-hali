<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sur Halı İznik | Halılar</title>

<meta
name="description"
content="Sur Halı İznik halı koleksiyonu">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Poppins',sans-serif;

background:#f5f3ef;

color:#2b2b2b;

}

/*==========================
HEADER
==========================*/

header{

background:#111;

color:#D4AF37;

padding:45px 20px;

text-align:center;

box-shadow:0 5px 20px rgba(0,0,0,.25);

}

header img{

width:120px;

margin-bottom:20px;

}

header h1{

font-size:40px;

font-weight:700;

letter-spacing:2px;

margin-bottom:10px;

}

header p{

font-size:17px;

color:#ddd;

}

/*==========================
CONTAINER
==========================*/

.container{

width:92%;

max-width:1400px;

margin:auto;

padding:50px 0;

}

/*==========================
GALERİ
==========================*/

.gallery{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(320px,1fr));

gap:30px;

}

/*==========================
ÜRÜN KARTI
==========================*/

.card{

background:#fff;

border-radius:18px;

overflow:hidden;

box-shadow:0 10px 35px rgba(0,0,0,.08);

transition:.35s;

}

.card:hover{

transform:translateY(-8px);

box-shadow:0 20px 45px rgba(0,0,0,.18);

}

.card img{

width:100%;

height:360px;

object-fit:cover;

display:block;

}

.card-content{

padding:22px;

}

.card-content h2{

font-size:24px;

margin-bottom:12px;

color:#222;

}

.price{

font-size:26px;

font-weight:700;

color:#D4AF37;

margin-bottom:10px;

}

.size{

display:inline-block;

padding:6px 12px;

background:#111;

color:#fff;

border-radius:8px;

margin-bottom:15px;

font-size:14px;

}

.description{

line-height:1.7;

color:#555;

font-size:15px;

}

  .loading{

text-align:center;

font-size:22px;

padding:80px;

color:#777;

}

.empty{

text-align:center;

padding:80px;

font-size:22px;

color:#888;

}

.back{

margin-top:60px;

text-align:center;

}

.back a{

display:inline-block;

padding:15px 35px;

background:#111;

color:#D4AF37;

text-decoration:none;

border-radius:12px;

font-weight:600;

transition:.3s;

}

.back a:hover{

background:#D4AF37;

color:#111;

}

footer{

margin-top:80px;

padding:35px;

background:#111;

color:#aaa;

text-align:center;

font-size:14px;

}

@media(max-width:768px){

header h1{

font-size:30px;

}

.card img{

height:270px;

}

.gallery{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<header>

<img src="logo.png" alt="Sur Halı">

<h1>HALI KOLEKSİYONU</h1>

<p>Sur Halı İznik • Premium Halı Modelleri</p>

</header>

<div class="container">

<div
id="gallery"
class="gallery">

<div class="loading">

Ürünler yükleniyor...

</div>

</div>

<div class="back">

<a href="index.html">

← Ana Sayfaya Dön

</a>

</div>

</div>

<footer>

© 2026 Sur Halı İznik • Tüm Hakları Saklıdır.

</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script>

  const gallery = document.getElementById("gallery");

async function loadProducts() {

    gallery.innerHTML =
    `<div class="loading">Ürünler yükleniyor...</div>`;

    const { data, error } = await supabase
        .from("products")
        .select("*")
        .eq("category","Halı")
        .order("created_at",{ascending:false});

    if(error){

        gallery.innerHTML=`
        <div class="empty">
        Ürünler yüklenemedi.
        </div>`;

        console.error(error);

        return;

    }

    if(data.length===0){

        gallery.innerHTML=`
        <div class="empty">
        Henüz halı eklenmemiş.
        </div>`;

        return;

    }

    gallery.innerHTML="";

    data.forEach(product=>{

        gallery.innerHTML+=`

        <div class="card">

            <img src="${product.image_url}" alt="${product.name}">

            <div class="card-content">

                <h2>${product.name}</h2>

                <div class="price">

                    ${product.price ?? "-"} ₺

                </div>

                <div class="size">

                    ${product.size ?? ""}

                </div>

                <div class="description">

                    ${product.description ?? ""}

                </div>

            </div>

        </div>

        `;

    });

}

loadProducts();
